    sdk: flutter
  app_settings: ^9.0.0
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.2
  crypto: ^3.0.3
  path: ^1.9.0
  sqlite3: ">=2.4.0 <3.0.0"
  sqlite3_flutter_libs: ^0.5.24
  flutter_secure_storage: ^9.2.4
