name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
          libayatana-appindicator3-dev
          libkeybinder-3.0-dev gnome-screenshot
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test test_driver packages/yjs_dart/lib
      - run: flutter analyze --no-fatal-infos
      # Widget golden 与异步图片预取在并发 isolate 下会争抢字体/图标光栅化
      # 和解码资源，出现仅数百像素的非确定性差异；串行执行保持基线稳定。
      - run: flutter test --concurrency=1
      - run: flutter build web --release
      - run: flutter build linux --debug

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --debug

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --debug
